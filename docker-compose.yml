services:
  manager:
    build:
      context: .
    container_name: mt5-autotester-manager
    restart: unless-stopped
    ports:
      - "8750:8750"
    environment:
      # Quien termina TLS es el proxy, no el manager. Sin esto, un certificado
      # olvidado en runtime/tls lo pondría a hablar https por dentro y el
      # proxy no se entendería con él.
      MT5_MANAGER_TLS: ${MT5_MANAGER_TLS:-on}
      MT5_MANAGER_EXPORT_MODE: download
      MT5_MANAGER_CONTAINER_NAME: mt5-autotester-manager
      MT5_MANAGER_RESTART_REPO: /workspace/manager-repo
      MT5_MANAGER_RESTART_STATE: /app/runtime/manager_restart.json
      MT5_MANAGER_RESTART_LOG: /app/runtime/manager_restart.log
      MT5_MANAGER_GUIDED_DEV_BROKERS: ${MT5_MANAGER_GUIDED_DEV_BROKERS:-}
      MT5_MANAGER_PROXY_BROKERS: ${MT5_MANAGER_PROXY_BROKERS:-}
      # Los dos los usan los avisos del dispositivo para decir quién manda el
      # push: el servicio de push de Apple rechaza el JWT si no lleva un
      # `mailto:` o una URL de verdad, y los dos valores ya están en `.env`
      # para el proxy. Sin ellos el manager firma como `mt5-manager@localhost`,
      # que a Chrome y Firefox les basta y a Safari no.
      ACME_EMAIL: ${ACME_EMAIL:-}
      MANAGER_DOMAIN: ${MANAGER_DOMAIN:-}
      GH_CONFIG_DIR: /root/.config/gh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ${MT5_MANAGER_REPO_SOURCE:-.}
        target: /workspace/manager-repo
      - type: bind
        source: ${MT5_MANAGER_CONFIG_SOURCE:-./manager.json}
        target: /app/config/manager.json
        read_only: true
      - type: bind
        source: ${MT5_MANAGER_RUNTIME_SOURCE:-./runtime}
        target: /app/runtime
      - type: bind
        source: ${IC_PROJECT_DIR}
        target: /data/ic
      - type: bind
        source: ${AXI_PROJECT_DIR}
        target: /data/axi
      - type: bind
        source: ${ROBOFOREX_PROJECT_DIR}
        target: /data/roboforex
      - type: bind
        source: ${VANTAGE_PROJECT_DIR}
        target: /data/vantage
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: volume
        source: manager-git-auth
        target: /root/.config/gh

  # Sólo arranca donde se pida -`COMPOSE_PROFILES=proxy` en `.env`-, porque
  # necesita un dominio propio apuntando a este equipo. Un equipo de agente que
  # no publica nada sigue levantando el manager solo, como siempre.
  proxy:
    image: caddy:2.10-alpine
    container_name: mt5-autotester-proxy
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      MANAGER_DOMAIN: ${MANAGER_DOMAIN:?el dominio público del manager, p.ej. casa.ddns.net}
      ACME_EMAIL: ${ACME_EMAIL:?correo para los avisos de caducidad de Let's Encrypt}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      # El certificado y la cuenta de Let's Encrypt viven aquí. Perder este
      # volumen es volver a emitir, y la emisión tiene límite por semana.
      - type: volume
        source: proxy-data
        target: /data
    depends_on:
      - manager

volumes:
  manager-git-auth:
  proxy-data:
