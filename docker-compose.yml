services:
  manager:
    build:
      context: .
    container_name: mt5-autotester-manager
    restart: unless-stopped
    ports:
      - "8750:8750"
    environment:
      MT5_MANAGER_EXPORT_MODE: download
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./manager.json
        target: /app/config/manager.json
        read_only: true
      - type: bind
        source: ./runtime
        target: /app/runtime
      - type: bind
        source: ${IC_PROJECT_DIR}
        target: /data/ic
      - type: bind
        source: ${AXI_PROJECT_DIR}
        target: /data/axi
      - type: bind
        source: ${ROBOFOREX_PROJECT_DIR}
        target: /data/roboforex
